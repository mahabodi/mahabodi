<text x="1088" y="204" text-anchor="middle" font-size="15" font-weight="800" style="fill:#ffffff">Typed answer</text>
<text x="1088" y="228" text-anchor="middle" font-size="12" font-weight="500" style="fill:#ffffff">choice · score · yes/no</text>
<text x="1088" y="252" text-anchor="middle" font-size="12" font-weight="500" style="fill:#ffffff">+ probabilities</text>
<text x="1088" y="276" text-anchor="middle" font-size="12" font-weight="500" style="fill:#ffffff">+ memory citation</text>
<text x="1088" y="300" text-anchor="middle" font-size="12" font-weight="500" style="fill:#ffffff">+ handoff flag</text>
<line x1="947" y1="244" x2="998" y2="244" stroke="#7d958f" stroke-width="1.8" marker-end="url(#ar)"/>
<path d="M 1088 176 C 1088 60, 600 52, 300 60 S 40 64, 26 104" stroke="#179a5f" stroke-width="1.8" stroke-dasharray="6 6" fill="none" marker-end="url(#ar)"/>
<text x="640" y="48" text-anchor="middle" font-size="13" font-weight="600" fill="#179a5f" style="fill:#179a5f">the typed decision goes back to the agent</text>
<rect x="240" y="392" width="728" height="118" rx="18" fill="#fffaf0" stroke="#b67a18" stroke-opacity=".55"/>
<text x="260" y="418" font-size="15" font-weight="800" fill="#b67a18" style="fill:#b67a18">Memory</text>
<rect x="270" y="430" width="200" height="66" rx="12" fill="#ffffff" stroke="#b67a18" stroke-opacity=".5"/>
<text x="370" y="452" text-anchor="middle" font-size="13" font-weight="700">fastmemory graph</text>
<text x="370" y="469" text-anchor="middle" font-size="11" style="fill:#46655f">records · Louvain concept blocks</text>
<text x="370" y="484" text-anchor="middle" font-size="11" style="fill:#46655f">density guard keeps all reachable</text>
<rect x="506" y="430" width="200" height="66" rx="12" fill="#ffffff" stroke="#b67a18" stroke-opacity=".5"/>
<text x="606" y="452" text-anchor="middle" font-size="13" font-weight="700">Dense vectors</text>
<text x="606" y="469" text-anchor="middle" font-size="11" style="fill:#46655f">MiniLM embedder, ONNX</text>
<text x="606" y="484" text-anchor="middle" font-size="11" style="fill:#46655f">meaning search</text>
<rect x="742" y="430" width="200" height="66" rx="12" fill="#ffffff" stroke="#b67a18" stroke-opacity=".5"/>
<text x="842" y="452" text-anchor="middle" font-size="13" font-weight="700">Experience memory</text>
<text x="842" y="469" text-anchor="middle" font-size="11" style="fill:#46655f">labelled past decisions</text>
<text x="842" y="484" text-anchor="middle" font-size="11" style="fill:#46655f">learns instantly</text>
<path d="M 546 292 C 546 360, 370 400, 370 430" stroke="#b67a18" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<path d="M 546 292 C 546 360, 606 400, 606 430" stroke="#b67a18" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<path d="M 894 292 C 894 360, 842 400, 842 430" stroke="#b67a18" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
<path d="M 1088 312 C 1088 470, 960 470, 942 496" stroke="#b67a18" stroke-width="1.8" stroke-dasharray="6 6" fill="none" marker-end="url(#ar)"/>
<text x="985" y="532" font-size="12.5" font-weight="600" style="fill:#b67a18">learn(): labelled outcomes</text>
<text x="985" y="549" font-size="12.5" font-weight="600" style="fill:#b67a18">update memory in seconds,</text>
<text x="985" y="566" font-size="12.5" font-weight="600" style="fill:#b67a18">no retraining</text>
<rect x="240" y="532" width="728" height="96" rx="16" fill="none" stroke="#0e5b73" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="260" y="558" font-size="14" font-weight="800" style="fill:#0e5b73">Scale path</text>
<text x="352" y="558" font-size="12.5" style="fill:#46655f">PostgreSQL + pgvector (+ Apache AGE) holds memory by namespace, and each</text>
<text x="352" y="576" font-size="12.5" style="fill:#46655f">agent hydrates a small working set; models can be served separately (Triton).</text>
<text x="352" y="594" font-size="12.5" style="fill:#46655f">Tested: 5.9M Wikipedia pages loaded on one Mac mini. Decisions at that scale</text>
<text x="352" y="612" font-size="12.5" style="fill:#46655f">are still being measured; TB–PB sizes are a blueprint.</text>
<path d="M 604 510 L 604 532" stroke="#0e5b73" stroke-width="1.5" stroke-dasharray="3 4" marker-end="url(#ar)"/>
<text x="600" y="664" text-anchor="middle" font-size="13.5" font-weight="700">One core, six languages: Rust · Python · Node.js · Java · C#/.NET · Go (+ C ABI)</text>
<text x="600" y="690" text-anchor="middle" font-size="11.5" style="fill:#7d958f">Illustrative flow; component names match the source code. Measured results are in BENCHMARKS.md.</text>
