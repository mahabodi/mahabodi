<text x="410" y="140" font-size="13" fill="#46655f">one Rust core</text>
<rect x="262" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="278" cy="214" r="11" fill="#0e5b73"/><text x="278" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">1</text>
<text x="314" y="244" text-anchor="middle" font-size="13" font-weight="700">Typed request</text>
<text x="314" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">state · question</text>
<text x="314" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">· options</text>
<line x1="367" y1="244" x2="377" y2="244" stroke="#7d958f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="378" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="394" cy="214" r="11" fill="#0e5b73"/><text x="394" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">2</text>
<text x="430" y="244" text-anchor="middle" font-size="13" font-weight="700">Guard + cache</text>
<text x="430" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">script check</text>
<text x="430" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">· answer cache</text>
<line x1="483" y1="244" x2="493" y2="244" stroke="#7d958f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="494" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="510" cy="214" r="11" fill="#0e5b73"/><text x="510" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">3</text>
<text x="546" y="244" text-anchor="middle" font-size="13" font-weight="700">Query cascade</text>
<text x="546" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">lexical → typo</text>
<text x="546" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">→ dense</text>
<line x1="599" y1="244" x2="609" y2="244" stroke="#7d958f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="610" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="626" cy="214" r="11" fill="#0e5b73"/><text x="626" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">4</text>
<text x="662" y="244" text-anchor="middle" font-size="13" font-weight="700">Shortlist</text>
<text x="662" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">top-k retrieval</text>
<text x="662" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">· tournament</text>
<line x1="715" y1="244" x2="725" y2="244" stroke="#7d958f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="726" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="742" cy="214" r="11" fill="#0e5b73"/><text x="742" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">5</text>
<text x="778" y="244" text-anchor="middle" font-size="13" font-weight="700">Laya decision</text>
<text x="778" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">ONNX Runtime</text>
<text x="778" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">· one pass</text>
<line x1="831" y1="244" x2="841" y2="244" stroke="#7d958f" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="842" y="196" width="104" height="96" rx="12" fill="#ffffff" stroke="#0e5b73" stroke-opacity=".45"/>
<circle cx="858" cy="214" r="11" fill="#0e5b73"/><text x="858" y="218" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff" style="fill:#fff">6</text>
<text x="894" y="244" text-anchor="middle" font-size="13" font-weight="700">Experience</text>
<text x="894" y="262" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">labelled cases</text>
<text x="894" y="277" text-anchor="middle" font-size="11" fill="#46655f" style="fill:#46655f">· calibrate</text>
<text x="604" y="334" text-anchor="middle" font-size="12.5" fill="#46655f" style="fill:#46655f">No text generated · a probability for every option · every answer reports its memory stage, match and handoff</text>
