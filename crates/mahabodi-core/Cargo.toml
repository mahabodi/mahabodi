[package]
name = "mahabodi-core"
description = "MahaBodi: a System-1 engine for AI agents - fastmemory topology memory plus Laya decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["ai-agents", "memory", "decision", "retrieval", "onnx"]
categories = ["science", "text-processing"]

[features]
default = ["laya"]
laya = ["dep:ort", "dep:tokenizers"]

[dependencies]
# fastmemory's parser and inline Louvain are vendored (src/fastmemory/, MIT): the crates.io 0.4.0 release
# shells out to an embedded binary instead, and a git dependency cannot be published to crates.io.
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex-lite = "0.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
