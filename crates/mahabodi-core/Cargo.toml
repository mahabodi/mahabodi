[package]
name = "mahabodi-core"
description = "MahaBodi: a System-1 engine for AI agents - fastmemory topology memory plus Laya decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["ai-agents", "memory", "decision", "retrieval", "onnx"]
categories = ["science", "text-processing"]

[features]
default = ["laya"]
laya = ["dep:ort", "dep:tokenizers"]
# PostgreSQL large-memory store (deploy/postgres/DESIGN_STORE.md); off by default
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres", "dep:tokio-postgres-rustls", "dep:rustls", "dep:webpki-roots", "dep:rustls-pemfile"]

[dependencies]
# fastmemory: parser and clustering (rust-louvain when its library is available). Core only: no CLI, server or
# telemetry. LOCAL PATH for the fastmemory-dep branch; must become a published version before this is pushed.
fastmemory = { path = "../../../upperspace3/fastmemory", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
regex-lite = "0.1"
rayon = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-23"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }
postgres = { version = "0.19", optional = true }
r2d2 = { version = "0.8", optional = true }
r2d2_postgres = { version = "0.18", optional = true }
# TLS for managed PostgreSQL (RDS, Cloud SQL, Supabase, Neon) without OpenSSL: rustls with the Mozilla root store
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }
webpki-roots = { version = "0.26", optional = true }
