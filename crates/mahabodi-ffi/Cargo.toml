[package]
name = "mahabodi-ffi"
description = "C ABI for Bodi (JSON in, JSON out) - used by the Go and C#/.NET bindings"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mahabodi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mahabodi-core = { path = "../mahabodi-core" }
serde_json = { version = "1", features = ["preserve_order"] }
