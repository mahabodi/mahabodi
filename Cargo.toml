[workspace]
resolver = "2"
members = [
    "crates/mahabodi-core",
    "crates/mahabodi",
    "crates/mahabodi-ffi",
    "bindings/python",
    "bindings/node",
    "bindings/java/native",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mahabodi/mahabodi"
homepage = "https://github.com/mahabodi/mahabodi"
authors = ["MahaBodi contributors"]
rust-version = "1.88"
